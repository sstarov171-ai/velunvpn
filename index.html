<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VelunVPN 🌙</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #14182e 0%, #080a12 100%);
            --card-bg: rgba(22, 27, 46, 0.7);
            --card-border: rgba(138, 147, 212, 0.2);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-start: #4f46e5;
            --accent-end: #7c3aed;
            --accent-glow: rgba(99, 102, 241, 0.35);
            --btn-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            margin: 0;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
        }

        .glow-effect {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.22) 0%, rgba(79, 70, 229, 0.08) 50%, transparent 70%);
            z-index: 0;
            pointer-events: none;
            filter: blur(30px);
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 32px 24px 26px 24px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 24px rgba(99, 102, 241, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(138, 147, 212, 0.25);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.45;
            margin: 0 0 24px 0;
            color: var(--text-primary);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: linear-gradient(135deg, var(--accent-start) 0%, var(--accent-end) 100%);
            color: var(--btn-text);
            border: none;
            border-radius: 18px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 8px 24px var(--accent-glow);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:active {
            transform: scale(0.975);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(138, 147, 212, 0.3);
            box-shadow: none;
            margin-top: 10px;
        }

        .btn-outline:active {
            background: rgba(255, 255, 255, 0.1);
        }

        .arrow {
            margin: 8px 0;
            font-size: 18px;
            color: var(--text-secondary);
            opacity: 0.5;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(3px); }
        }

        .hint-text {
            font-size: 12.5px;
            color: var(--text-secondary);
            margin: 20px 0 10px 0;
            line-height: 1.4;
            opacity: 0.8;
        }

        .support-btn {
            background: transparent;
            color: #a5b4fc;
            border: none;
            font-size: 14px;
            font-weight: 500;
            margin-top: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="glow-effect"></div>

    <div class="container">
        <div class="brand-badge">
            <span>🌙</span> VelunVPN
        </div>

        <h2>Для установки и настройки VPN<br>поэтапно нажмите кнопки ниже</h2>

        <a id="btn-download" href="#" class="btn">Скачать приложение</a>

        <div class="arrow">↓</div>

        <a id="btn-setup" href="#" class="btn">Настроить</a>

        <a id="btn-guide" href="#" class="btn btn-outline" style="display: none;">📖 Инструкция по настройке</a>

        <div class="hint-text">Для стабильной работы желательно иметь как минимум 2ГБ свободной памяти.</div>

        <a href="https://t.me/VelunVPN_SUPPORT" class="support-btn" target="_blank">
            <span>🛠️</span> Решение проблем
        </a>
    </div>

    <script>
        // 1. Тестовый дефолтный ключ (из видео) — чтобы работало СРАЗУ, даже без ?sub=
        const DEFAULT_SUB = "https://yamakasi.cloud/subscription/08595a0c-611d-4fc2-b5bc-21efdfe1f056";
        const WINDOWS_GUIDE_URL = "https://telegra.ph/VelunVPN-Windows-Setup-01-01";

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // 2. Получаем sub из URL или берём тестовый
        const urlParams = new URLSearchParams(window.location.search);
        let subLink = urlParams.get('sub');
        if (!subLink) {
            subLink = DEFAULT_SUB;
        }

        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
        const isAndroid = /android/i.test(ua);
        const isMac = /Macintosh|MacIntel|MacPPC|Mac68K/.test(ua);

        const btnDownload = document.getElementById('btn-download');
        const btnSetup = document.getElementById('btn-setup');
        const btnGuide = document.getElementById('btn-guide');

        function triggerHaptic() {
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        if (isIOS) {
            // iOS
            const appStoreUrl = "https://apps.apple.com/us/app/incy/id6756943388?l=ru";
            btnDownload.href = appStoreUrl;
            btnDownload.target = "_blank";
            btnDownload.onclick = () => { triggerHaptic(); };

            // Диплинк для Incy (именно так Telegram вызывает системное модальное окно)
            btnSetup.href = `incy://${subLink}`;
            btnSetup.onclick = () => { triggerHaptic(); };

        } else if (isAndroid) {
            // Android
            const playStoreUrl = "https://play.google.com/store/apps/details?id=llc.itdev.incy";
            btnDownload.href = playStoreUrl;
            btnDownload.target = "_blank";
            btnDownload.onclick = () => { triggerHaptic(); };

            btnSetup.href = `incy://${subLink}`;
            btnSetup.onclick = () => { triggerHaptic(); };

        } else if (isMac) {
            // Mac
            btnDownload.href = "https://apps.apple.com/app/foxray/id6448898396";
            btnDownload.target = "_blank";
            btnDownload.onclick = () => { triggerHaptic(); };

            btnSetup.innerText = "Скопировать ключ";
            btnSetup.href = "javascript:void(0)";
            btnSetup.onclick = (e) => {
                e.preventDefault();
                triggerHaptic();
                navigator.clipboard.writeText(subLink).then(() => {
                    if (tg && tg.showAlert) tg.showAlert("Ключ скопирован! Добавьте его в FoXray 🍏");
                    else alert("Ключ скопирован! Добавьте его в FoXray 🍏");
                });
            };

        } else {
            // Windows
            btnDownload.href = "https://github.com/sstarov171-ai/velunvpn/releases/download/1.0/v2rayN.zip";
            btnDownload.onclick = () => { triggerHaptic(); };

            btnSetup.innerText = "Скопировать ключ";
            btnSetup.href = "javascript:void(0)";
            btnSetup.onclick = (e) => {
                e.preventDefault();
                triggerHaptic();
                navigator.clipboard.writeText(subLink).then(() => {
                    if (tg && tg.showAlert) tg.showAlert("Ключ скопирован! Вставьте его в v2rayN ✨");
                    else alert("Ключ скопирован! Вставьте его в v2rayN ✨");
                });
            };

            btnGuide.style.display = "flex";
            btnGuide.href = WINDOWS_GUIDE_URL;
            btnGuide.target = "_blank";
            btnGuide.onclick = () => { triggerHaptic(); };
        }
    </script>
</body>
</html>
